<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>볼 파이트 - 크리에이터 대전</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #f5f5f5;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    user-select: none;
  }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .credit { font-size: 11px; color: #999; margin-bottom: 10px; }
  #arenaWrap {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 1;
    border: 4px solid #111;
    background: #fff;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    pointer-events: none;
    z-index: 5;
  }
  .hpBox {
    width: 42%;
    background: rgba(0,0,0,0.06);
    border-radius: 4px;
    overflow: hidden;
    border: 1.5px solid #111;
  }
  .hpBar { height: 14px; transition: width 0.15s; }
  .hpLabel { font-size: 11px; font-weight: 700; text-align: center; margin-top: 2px; }
  .controls {
    width: min(92vw, 420px);
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; gap: 8px; }
  .slot {
    flex: 1;
    border: 2px solid #111;
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    background: #fff;
    cursor: pointer;
    min-height: 75px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .slot.empty { color: #888; }
  .slot .cname { font-weight: 700; font-size: 13px; }
  .slot .ctag { font-size: 10px; color: #555; }
  .avatar-img {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid #111;
    object-fit: cover;
  }
  button.main {
    width: 100%; height: 46px;
    border: 2px solid #111; border-radius: 8px;
    background: #2fc455; color: #fff;
    font-size: 17px; font-weight: 700; cursor: pointer;
    font-family: inherit; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  button.main:active { transform: translateY(1px); }
  button.main:disabled { background: #aaa; cursor: not-allowed; }
  button.secondary {
    height: 38px; border: 2px solid #111; border-radius: 6px;
    background: #e8e8e8; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; padding: 0 12px;
    width: 100%;
  }
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; width: min(100%, 440px); max-height: 78vh;
    border-radius: 16px 16px 0 0; overflow-y: auto; padding: 16px 14px 24px;
  }
  .modal h2 { font-size: 16px; margin-bottom: 12px; text-align: center; }
  .charGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .charCard {
    border: 2px solid #111; border-radius: 10px; padding: 10px 8px;
    cursor: pointer; background: #fff; transition: background 0.12s;
  }
  .charCard:active { background: #f0f0f0; }
  .charCard .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .charCard .name { font-weight: 700; font-size: 13px; }
  .charCard .desc { font-size: 11px; color: #555; line-height: 1.35; }
  .result {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(255,255,255,0.88); z-index: 10;
    flex-direction: column; gap: 10px;
  }
  .result.show { display: flex; }
  .result .title { font-size: 28px; font-weight: 900; }
  .result .sub { font-size: 15px; color: #333; }
</style>
</head>
<body>
  <div class="credit">볼 파이트 · 크리에이터 에디션</div>
  <h1>볼 파이트</h1>

  <div id="arenaWrap">
    <div class="hud">
      <div style="width:42%">
        <div class="hpBox"><div class="hpBar" id="hp1" style="width:100%;background:#4a90e2"></div></div>
        <div class="hpLabel" id="name1">-</div>
      </div>
      <div style="width:42%;text-align:right">
        <div class="hpBox" style="margin-left:auto"><div class="hpBar" id="hp2" style="width:100%;background:#e24a4a"></div></div>
        <div class="hpLabel" id="name2">-</div>
      </div>
    </div>
    <canvas id="cv"></canvas>
    <div class="result" id="result">
      <div class="title" id="resTitle">승!</div>
      <div class="sub" id="resSub"></div>
      <button class="secondary" onclick="resetFight()">다시 하기</button>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <div class="slot empty" id="slot1" onclick="openSelect(0)">
        <div class="avatar-img" style="background:#ccc;display:flex;align-items:center;justify-content:center;font-size:12px;">+</div>
        <div class="cname">추가하기</div>
      </div>
      <div class="slot empty" id="slot2" onclick="openSelect(1)">
        <div class="avatar-img" style="background:#ccc;display:flex;align-items:center;justify-content:center;font-size:12px;">+</div>
        <div class="cname">추가하기</div>
      </div>
    </div>
    <button class="secondary" onclick="openCodex()">📖 크리에이터 도감</button>
    <button class="main" id="startBtn" disabled onclick="startFight()">시작하기 ▶</button>
  </div>

  <!-- 캐릭터 선택 모달 -->
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeSelect()">
    <div class="modal">
      <h2>크리에이터 선택</h2>
      <div class="charGrid" id="charGrid"></div>
    </div>
  </div>

  <!-- 도감 모달 -->
  <div class="modal-bg" id="codexModalBg" onclick="if(event.target===this)closeCodex()">
    <div class="modal">
      <h2>📖 크리에이터 도감</h2>
      <div class="charGrid" id="codexGrid"></div>
      <div style="margin-top: 12px;">
        <button class="secondary" onclick="closeCodex()">닫기</button>
      </div>
    </div>
  </div>

<script>
function makeSvgUrl(bg, content) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="${bg}"/>${content}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const loadedImages = {};
CHARS.forEach(c => {
  const img = new Image();
  img.src = c.imgUrl;
  loadedImages[c.id] = img;
});

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let ARENA = 400, W = 400, H = 400;
let selected = [null, null], selectSlot = 0;
let fighters = [], monsters = [], wells = [], floats = [];
let running = false, lastT = 0, winner = null;

function resize() {
  const wrap = document.getElementById('arenaWrap');
  const s = wrap.clientWidth;
  canvas.width = s; canvas.height = s;
  W = s; H = s; ARENA = s;
}
window.addEventListener('resize', resize);
resize();

function openSelect(slot) {
  if (running) return;
  selectSlot = slot;
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  CHARS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'charCard';
    card.innerHTML = `
      <div class="top">
        <img src="${c.imgUrl}" class="avatar-img" onerror="this.src='https://picsum.photos/id/10/100/100'">
        <div class="name">${c.name}</div>
      </div>
      <div class="desc">${c.tag} · HP ${c.hp}<br>${c.desc}</div>
    `;
    card.onclick = () => pickChar(c);
    grid.appendChild(card);
  });
  document.getElementById('modalBg').classList.add('show');
}
function closeSelect() { document.getElementById('modalBg').classList.remove('show'); }

function openCodex() {
  if (running) return;
  const grid = document.getElementById('codexGrid');
  grid.innerHTML = '';
  CHARS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'charCard';
    card.innerHTML = `
      <div class="top">
        <img src="${c.imgUrl}" class="avatar-img" onerror="this.src='https://picsum.photos/id/10/100/100'">
        <div class="name">${c.name}</div>
      </div>
      <div class="desc"><b>${c.tag}</b> · HP ${c.hp} · 쿨타임 ${c.skillCd}초<br>${c.desc}</div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('codexModalBg').classList.add('show');
}
function closeCodex() { document.getElementById('codexModalBg').classList.remove('show'); }

function pickChar(c) {
  selected[selectSlot] = c;
  const slot = document.getElementById('slot' + (selectSlot + 1));
  slot.classList.remove('empty');
  slot.innerHTML = `
    <img src="${c.imgUrl}" class="avatar-img" onerror="this.src='https://picsum.photos/id/10/100/100'">
    <div class="cname">${c.name}</div>
    <div class="ctag">${c.tag}</div>
  `;
  closeSelect();
  document.getElementById('startBtn').disabled = !(selected[0] && selected[1]);
}

function updateHud() {
  if (fighters.length < 2) return;
  const [a, b] = fighters;
  document.getElementById('hp1').style.width = Math.max(0, a.hp / a.maxHp * 100) + '%';
  document.getElementById('hp2').style.width = Math.max(0, b.hp / b.maxHp * 100) + '%';
  document.getElementById('name1').textContent = a.name;
  document.getElementById('name2').textContent = b.name;
}

function damage(target, amount, source) {
  if (target.hp <= 0) return;
  if (target.shield && target.shield > 0) {
    floatText(target.x, target.y - 18, '방어막 방어!', '#ffb703');
    return;
  }
  if (target.dodgeCharges && target.dodgeCharges > 0 && Math.random() < 0.55) {
    target.dodgeCharges--;
    floatText(target.x, target.y - 18, '회피!', '#fdcb6e');
    return;
  }
  let dmg = amount;
  if (target.weak) dmg *= 0.8;
  if (target.defense) dmg *= (1 - target.defense);
  dmg = Math.max(1, Math.round(dmg));
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    if (target.onDeath && target.onDeath(target)) {} else { endFight(source); }
  }
}

function floatText(x, y, text, color) {
  floats.push({ x, y, text, color, life: 1.1, vy: -40 });
}

function endFight(winnerF) {
  running = false;
  winner = winnerF;
  document.getElementById('resTitle').textContent = winnerF.name + ' 승!';
  document.getElementById('resSub').textContent = 'HP ' + Math.round(winnerF.hp) + ' 남음';
  document.getElementById('result').classList.add('show');
}

function resetFight() {
  document.getElementById('result').classList.remove('show');
  fighters = []; monsters = []; wells = []; floats = [];
  running = false;
  drawIdle();
}

function startFight() {
  if (!selected[0] || !selected[1]) return;
  document.getElementById('result').classList.remove('show');
  monsters = []; wells = []; floats = [];

  const make = (c, side) => ({
    ...c,
    x: side === 0 ? W * 0.28 : W * 0.72,
    y: H * 0.5,
    vx: (side === 0 ? 1 : -1) * (Math.random() * 5 + 5),
    vy: (Math.random() - 0.5) * 8,
    r: W * 0.065,
    hp: c.hp, maxHp: c.hp,
    skillTimer: c.skillCd ? c.skillCd * (0.4 + Math.random() * 0.4) : 999,
    freeze: 0, slow: 0, shield: 0, weak: 0, doubleDmg: 0,
    revived: false, dodgeCharges: c.dodgeCharges || 0,
    auraCd: 0, onDeath: c.onDeath || null
  });
  fighters = [make(selected[0], 0), make(selected[1], 1)];
  running = true;
  lastT = performance.now();
  updateHud();
  requestAnimationFrame(loop);
}

function loop(t) {
  if (!running) return;
  const dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;

  const [a, b] = fighters;
  if (!a || !b) return;

  [a, b].forEach(f => {
    if (f.freeze > 0) f.freeze -= dt;
    if (f.slow > 0) f.slow -= dt;
    if (f.shield > 0) f.shield -= dt;
    if (f.weak > 0) f.weak -= dt;
    if (f.doubleDmg > 0) f.doubleDmg -= dt;
  });

  [a, b].forEach(f => {
    if (f.freeze > 0) return;
    let spd = f.speed * (W / 400) * 125;
    if (f.slow > 0) spd *= 0.5;
    
    const foe = f === a ? b : a;
    const angTo = Math.atan2(foe.y - f.y, foe.x - f.x);
    f.vx += Math.cos(angTo) * 0.5 + (Math.random() - 0.5) * 1.0;
    f.vy += Math.sin(angTo) * 0.5 + (Math.random() - 0.5) * 1.0;
    
    const maxV = spd * 0.09;
    const v = Math.hypot(f.vx, f.vy);
    if (v > maxV) { f.vx *= maxV / v; f.vy *= maxV / v; }
    
    f.x += f.vx; f.y += f.vy;

    const bounce = 1.04;
    if (f.x < f.r) { f.x = f.r; f.vx = Math.abs(f.vx) * bounce; }
    if (f.x > W - f.r) { f.x = W - f.r; f.vx = -Math.abs(f.vx) * bounce; }
    if (f.y < f.r + 20) { f.y = f.r + 20; f.vy = Math.abs(f.vy) * bounce; }
    if (f.y > H - f.r) { f.y = H - f.r; f.vy = -Math.abs(f.vy) * bounce; }
  });

  monsters.forEach(m => {
    m.life -= dt;
    m.x += m.vx; m.y += m.vy;
    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    if (m.y < m.r || m.y > H - m.r) m.vy *= -1;
    [a, b].forEach(f => {
      if (f !== m.owner && Math.hypot(f.x - m.x, f.y - m.y) < f.r + m.r) {
        damage(f, 3, m.owner);
      }
    });
  });
  monsters = monsters.filter(m => m.life > 0);

  wells.forEach(w => {
    w.life -= dt;
    [a, b].forEach(f => {
      if (f === w.owner) return;
      const d = Math.hypot(f.x - w.x, f.y - w.y);
      if (d < w.r) {
        f.vx += (w.x - f.x) / d * 1.8;
        f.vy += (w.y - f.y) / d * 1.8;
        if (Math.random() < dt * 5) damage(f, 2, w.owner);
      }
    });
  });
  wells = wells.filter(w => w.life > 0);

  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy);
  const minD = a.r + b.r;
  if (dist < minD && dist > 0) {
    const nx = dx / dist, ny = dy / dist;
    const overlap = minD - dist;
    a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
    
    const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
    const imp = (dvx * nx + dvy * ny);
    if (imp < 0) {
      a.vx -= imp * nx * 1.35; a.vy -= imp * ny * 1.35;
      b.vx += imp * nx * 1.35; b.vy += imp * ny * 1.35;
    }
    damage(a, 3, b); damage(b, 3, a);
  }

  if (a.auraTick) a.auraTick(a, b, dt);
  if (b.auraTick) b.auraTick(b, a, dt);

  [a, b].forEach(f => {
    if (f.freeze > 0 || !f.skill) return;
    f.skillTimer -= dt;
    if (f.skillTimer <= 0) {
      f.skillTimer = f.skillCd || 5;
      f.skill(f, f === a ? b : a);
    }
  });

  floats.forEach(ft => { ft.life -= dt; ft.y += ft.vy * dt; });
  floats = floats.filter(ft => ft.life > 0);

  updateHud();
  draw();
  if (running) requestAnimationFrame(loop);
}

function drawIdle() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#bbb';
  ctx.font = `600 ${Math.floor(W * 0.045)}px "Noto Sans KR", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('크리에이터를 선택하고 시작하세요', W / 2, H / 2);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  wells.forEach(w => {
    const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
    g.addColorStop(0, 'rgba(108,92,231,0.4)'); g.addColorStop(1, 'rgba(108,92,231,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
  });

  monsters.forEach(m => {
    ctx.fillStyle = '#00b4d8'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke();
    ctx.font = '14px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👾', m.x, m.y);
  });

  fighters.forEach((f) => {
    if (f.aura) {
      ctx.strokeStyle = 'rgba(42,157,143,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + f.aura, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.save();
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.clip();
    const img = loadedImages[f.id];
    if (img && img.complete && img.naturalWidth !== 0) {
      ctx.drawImage(img, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    } else {
      ctx.fillStyle = f.color; ctx.fill();
    }
    ctx.restore();

    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = f.shield > 0 ? '#ffb703' : '#111'; ctx.stroke();

    ctx.font = `700 ${Math.floor(W * 0.032)}px "Noto Sans KR", sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = '#111';
    ctx.fillText(f.name, f.x, f.y - f.r - 8);
  });

  floats.forEach(ft => {
    ctx.globalAlpha = Math.min(1, ft.life * 1.5);
    ctx.font = `700 ${Math.floor(W * 0.038)}px "Noto Sans KR", sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
  });
}

drawIdle();
</script>
